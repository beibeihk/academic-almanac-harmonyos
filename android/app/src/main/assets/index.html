<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' file:">
  <title>学术黄历</title>
  <style>
    :root{--paper:#f7f2e8;--card:#fffcf5;--ink:#26221d;--muted:#766e64;--red:#a63228;--line:#ddd2c1;--soft:#f2e7d8}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif}
    button,input,textarea{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
    #root{height:100%;display:flex;flex-direction:column}.page{flex:1;overflow:auto;padding:16px 18px 92px}.header{display:flex;align-items:center;gap:12px}.grow{flex:1}
    h1{font-size:28px;letter-spacing:2px;margin:0}.en{font-size:10px;letter-spacing:2px;color:var(--muted)}.muted{color:var(--muted)}.small{font-size:12px;line-height:1.65}
    .outline,.soft,.primary{border-radius:10px;padding:9px 13px}.outline{background:transparent;border:1px solid var(--line);color:var(--muted)}.soft{background:#efe7da;color:var(--red)}.primary{background:var(--red);color:white}
    .datebar,.discipline-badge,.row{display:flex;align-items:center;gap:8px}.datebar{margin:14px 0 7px}.discipline-badge{font-size:12px;color:var(--red);margin-bottom:10px}.divider{height:1px;background:var(--red);margin:8px 0 12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin:10px 0}.fortune{background:var(--soft);display:flex;align-items:center}.fortune-mark{width:62px;height:62px;border:2px solid var(--red);border-radius:9px;display:grid;place-items:center;color:var(--red);font-weight:700;font-size:21px}
    .section-row{display:flex;gap:12px}.seal{color:var(--red);font-size:21px;font-weight:700;width:30px;text-align:center}.items{flex:1}.item+.item{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}.item-title{font-size:15px;font-weight:600}.item-sub{font-size:12px;color:var(--muted);margin-top:3px}.add{float:right;background:transparent;color:var(--red);padding:0 0 0 8px}
    .quote{text-align:center;padding:8px 12px;font-size:16px;font-style:italic;line-height:1.55}.notice{text-align:center;color:#9a9187;font-size:11px}.actions{display:flex;gap:8px}.actions>*{flex:1}
    .bottom{position:fixed;left:0;right:0;bottom:0;height:64px;padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:8}.tab{flex:1;background:transparent;color:var(--muted)}.tab.active{color:var(--red);background:var(--soft);font-weight:700}
    .title{font-size:26px;font-weight:700;margin:4px 0}.subtitle{font-size:12px;color:var(--muted);margin-bottom:14px}.field{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px;color:var(--ink)}textarea.field{min-height:110px;resize:vertical}.chips{display:flex;gap:6px;overflow:auto;padding:3px 0}.chip{white-space:nowrap;background:#efe7da;color:var(--muted);border-radius:9px;padding:8px 12px}.chip.active{background:var(--red);color:white}
    .task{display:flex;gap:10px;align-items:flex-start}.check{width:36px;height:36px;border-radius:8px;background:#efe7da;color:var(--red);font-size:20px}.task.done .check{background:var(--red);color:white}.task.done .task-name{text-decoration:line-through;color:var(--muted)}.task-meta{font-size:11px;color:var(--muted);margin-top:4px}.danger{background:transparent;color:var(--muted);padding:8px}.feedback{color:var(--red);font-size:12px;line-height:1.6;margin:8px 0}.timer{text-align:center;font-size:55px;font-variant-numeric:tabular-nums;letter-spacing:2px;margin:22px 0 8px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 5px}.stat strong{display:block;font-size:22px;color:var(--red)}
    .week-row{display:grid;grid-template-columns:78px 1fr 56px;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.overlay{position:fixed;inset:0;background:#99000000;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.modal h2{margin:0 0 10px}.discipline-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.discipline-option{height:44px;border-radius:10px;background:#efe7da;color:var(--ink)}.discipline-option.active{background:var(--red);color:white}.policy{font-size:13px;line-height:1.75}.policy h3{font-size:15px;margin:13px 0 2px}.about-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}.center{text-align:center}.top-space{margin-top:14px}
  </style>
</head>
<body><div id="root"><div class="page center">正在准备本地语料库…</div></div>
<script src="corpus-data.js"></script>
<script>
'use strict';
const DISCIPLINES=['哲学','经济学','法学','教育学','文学','历史学','理学','工学','农学','医学','管理学','军事学','艺术学','交叉学科'];
const state={base:null,corpus:null,page:'almanac',date:new Date(),disciplineDraft:'',changeDiscipline:false,feedback:'',focusMinutes:25,focusLeft:1500,focusRunning:false,focusDeadline:0,focusTimer:null};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
const dateOf=k=>new Date(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6,8),12); const today=()=>{const d=new Date();d.setHours(12,0,0,0);return d};
function fnv(text){let h=0x811c9dc5;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,0x01000193)}return h>>>0}
function random(seed){let state=(seed||0x6D2B79F5)>>>0;return()=>{let value=state;value^=value<<13;value^=value>>>17;value^=value<<5;state=value>>>0;return state}}
function pick(list,seed){return list[random(fnv(seed))()%list.length]}
const CONFLICT_TAGS=['review','submission','writing','coding','data','presentation','reference','advisor','experiment','regression'];
function conflictTags(items){return [...new Set(items.flatMap(item=>item.tags.filter(tag=>CONFLICT_TAGS.includes(tag))))]}
function selectOne(items,seed,weekday,forbidden=[]){
  const preferred=weekday===1?['plan','reading','writing']:weekday===5?['backup','finish','submission']:
    weekday===0||weekday===6?['reading','reference','rest','ideas']:[];
  const candidates=items.filter(item=>!item.tags.some(tag=>CONFLICT_TAGS.includes(tag)&&forbidden.includes(tag)));
  let total=0;const weights=candidates.map(item=>{const weight=100+60*item.tags.filter(tag=>preferred.includes(tag)).length;total+=weight;return weight});
  let target=random(fnv(seed))()%total;
  for(let i=0;i<candidates.length;i++){target-=weights[i];if(target<0)return candidates[i]}
  return candidates[0];
}
function settings(){try{return JSON.parse(localStorage.getItem('settingsV12')||'{}')}catch{return {}}}
function saveSettings(v){localStorage.setItem('settingsV12',JSON.stringify(v))}
function workspace(){try{const w=JSON.parse(localStorage.getItem('workspaceV12')||'{}');return {tasks:Array.isArray(w.tasks)?w.tasks:[],favorites:Array.isArray(w.favorites)?w.favorites:[],sessions:Array.isArray(w.sessions)?w.sessions:[],reviews:w.reviews&&typeof w.reviews==='object'?w.reviews:{}}}catch{return {tasks:[],favorites:[],sessions:[],reviews:{}}}}
function saveWorkspace(w){localStorage.setItem('workspaceV12',JSON.stringify(w))}
function profile(){const name=settings().discipline;return state.corpus.disciplines.find(x=>x.name===name)}
function daily(d){const p=profile(),k=keyOf(d),base=`AcademicAlmanac-v2-${k}-${p.id}`,weekday=d.getDay();
  const yi=[selectOne(state.base.yi,base+'-yi-general',weekday),selectOne(p.yi,base+'-yi-discipline',weekday)];
  const forbidden=conflictTags(yi);
  const ji=[selectOne(state.base.ji,base+'-ji-general',weekday,forbidden),selectOne(p.ji,base+'-ji-discipline',weekday,forbidden)];
  const quotes=fnv(base+'-quote-mix')%4===0?state.base.quotes:p.quotes;
  const times=fnv(base+'-time-mix')%4===0?state.base.times:p.times;
  return {key:k,discipline:p.name,yi,ji,quote:pick(quotes,base+'-quote'),
    time:pick(times,base+'-time'),fortune:pick(state.base.fortunes,base+'-fortune')};}
function formatDate(d){return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function showFeedback(text){state.feedback=text;render()}
function modal(content){return `<div class="overlay"><div class="modal">${content}</div></div>`}
function renderPrivacy(rejected=false){$('#root').innerHTML=modal(`<h2>${rejected?'需要您的同意':'隐私保护提示'}</h2><p class="policy">${rejected?'您尚未同意隐私政策，因此暂时不能进入应用主功能。':'欢迎使用学术黄历。请在使用前阅读并理解《隐私政策》。本应用无需注册登录，全部功能离线运行；学科选择、计划、回顾、收藏及专注记录仅保存在本机，不上传或共享；不申请敏感权限，不含广告与第三方统计SDK。'}</p><button class="outline" style="width:100%" onclick="showPolicy()">查看完整《隐私政策》</button><div class="actions top-space">${rejected?'<button class="primary" onclick="renderPrivacy(false)">重新阅读并选择</button>':'<button class="soft" onclick="renderPrivacy(true)">暂不同意</button><button class="primary" onclick="acceptPrivacy()">同意并继续</button>'}</div>`)}
function policyHtml(){return `<h2>学术黄历隐私政策</h2><div class="muted small">生效及更新日期：2026年9月21日</div><div class="policy"><h3>1. 信息处理</h3><p>本应用不要求注册或登录。每日黄历依据设备本地日期、您主动选择的学科门类与内置原创文案生成。学科选择、计划、回顾、收藏及已完成专注记录仅保存在应用私有的本机存储内，不上传、出售或共享。</p><h3>2. 权限与联网</h3><p>本应用不申请位置、通讯录、相机、麦克风、照片、存储或设备标识符等权限，核心功能无需联网，不含广告及第三方统计SDK。</p><h3>3. 保存与共享</h3><p>本应用没有服务器，不向第三方提供数据，也不向境外传输数据。卸载应用会清除本机数据。</p><h3>4. 您的权利</h3><p>您可修改学科门类，管理计划、收藏与回顾，并在关于页清除全部本机记录。</p><h3>5. 联系我们</h3><p>huangkun123huang@163.com</p></div><button class="primary" style="width:100%" onclick="render()">返回</button>`}
function showPolicy(){const root=$('#root');root.insertAdjacentHTML('beforeend',modal(policyHtml()))}
function acceptPrivacy(){const s=settings();s.privacy=true;saveSettings(s);render()}
function renderDiscipline(){const current=settings().discipline; if(!state.disciplineDraft)state.disciplineDraft=current||'';$('#root').innerHTML=modal(`<h2>选择你的学科门类</h2><p class="small muted">每天会混合通用科研建议与所选学科专属内容。选择只保存在本机，之后可在“关于”中修改。</p><div class="discipline-grid">${DISCIPLINES.map(d=>`<button class="discipline-option ${state.disciplineDraft===d?'active':''}" onclick="chooseDiscipline('${d}')">${d}</button>`).join('')}</div><button class="primary" style="width:100%" ${state.disciplineDraft?'':'disabled'} onclick="confirmDiscipline()">${state.disciplineDraft?'确认选择 · '+state.disciplineDraft:'请选择一个学科门类'}</button>${current&&state.changeDiscipline?'<button class="outline top-space" style="width:100%" onclick="cancelDiscipline()">取消修改</button>':''}`)}
function chooseDiscipline(d){state.disciplineDraft=d;renderDiscipline()} function confirmDiscipline(){if(!DISCIPLINES.includes(state.disciplineDraft))return;const s=settings();s.discipline=state.disciplineDraft;saveSettings(s);state.changeDiscipline=false;state.feedback=`已切换为${s.discipline}。`;render()}
function cancelDiscipline(){state.changeDiscipline=false;state.disciplineDraft=settings().discipline;render()}
function openDiscipline(){state.changeDiscipline=true;state.disciplineDraft=settings().discipline;renderDiscipline()}
function nav(page){state.page=page;state.feedback='';render()}
function navBar(){return `<nav class="bottom">${[['almanac','黄历'],['plan','计划'],['focus','专注'],['review','回顾']].map(([id,t])=>`<button class="tab ${state.page===id?'active':''}" onclick="nav('${id}')">${t}</button>`).join('')}</nav>`}
function header(title,subtitle){return `<div class="header"><div class="grow"><div class="title">${title}</div><div class="subtitle">${subtitle}</div></div><button class="outline" onclick="showAbout()">关于</button></div>`}
function feedback(){return state.feedback?`<div class="feedback">${esc(state.feedback)}</div>`:''}
function renderAlmanac(){const a=daily(state.date),w=workspace(),fav=w.favorites.includes(a.key);return `<main class="page"><div class="header"><div class="grow"><h1>学术黄历</h1><div class="en">ACADEMIC ALMANAC</div></div><button class="outline" onclick="showAbout()">关于</button></div><div class="datebar"><span>${formatDate(state.date)}</span><span class="grow"></span><span class="muted">星期${'日一二三四五六'[state.date.getDay()]}</span></div><div class="discipline-badge"><span>学科</span><strong>${a.discipline}</strong><span class="muted">通用＋专属语料</span></div><div class="divider"></div><section class="card fortune"><div class="grow"><div class="small muted">${a.key===keyOf(today())?'今日':'当日'}学术签</div><div>${a.fortune.phrase}</div></div><div class="fortune-mark">${a.fortune.level}</div></section>${section('宜',a.yi,true)}${section('忌',a.ji,false)}<section class="card"><div class="row"><b style="color:var(--red)">吉时</b><span class="grow"></span><b>${a.time.time}</b></div><div class="top-space"><b>${a.time.task}</b></div><div class="item-sub">${a.time.subtitle}</div></section><div class="quote">“${a.quote.text}”</div><div class="notice">科研趣味内容 · 仅供娱乐</div><div class="actions top-space"><input class="field" type="date" value="${a.key.slice(0,4)}-${a.key.slice(4,6)}-${a.key.slice(6)}" onchange="changeDate(this.value)"><button class="soft" onclick="toggleFavorite()">${fav?'已收藏':'收藏日签'}</button><button class="soft" onclick="goToday()">今日</button></div>${feedback()}</main>${navBar()}`}
function section(mark,items,canAdd){return `<section class="card section-row"><div class="seal">${mark}</div><div class="items">${items.map(x=>`<div class="item">${canAdd?`<button class="add" onclick="quickTask('${esc(x.title)}')">+计划</button>`:''}<div class="item-title">${esc(x.title)}</div><div class="item-sub">${esc(x.subtitle)}</div></div>`).join('')}</div></section>`}
function changeDate(v){const d=new Date(v+'T12:00:00');if(!Number.isNaN(d.getTime())){state.date=d;render()}} function goToday(){state.date=today();render()}
function toggleFavorite(){const w=workspace(),k=keyOf(state.date),i=w.favorites.indexOf(k);if(i>=0)w.favorites.splice(i,1);else w.favorites.push(k);saveWorkspace(w);render()}
function quickTask(title){const w=workspace(),k=keyOf(state.date);if(!w.tasks.some(t=>t.date===k&&t.title===title))w.tasks.push({id:'t'+Date.now(),date:k,title,category:'其他',done:false});saveWorkspace(w);showFeedback('已加入计划。')}
function renderPlan(){const w=workspace(),k=keyOf(state.date),tasks=w.tasks.filter(t=>t.date===k);return `<main class="page">${header('科研计划','为当前日期安排一件可以完成的小事')}<div class="datebar"><button class="soft" onclick="shiftDate(-1)">‹</button><strong class="grow center">${formatDate(state.date)}</strong><button class="soft" onclick="shiftDate(1)">›</button></div><div class="chips" id="planCats">${['阅读','写作','代码','实验','其他'].map((c,i)=>`<button class="chip ${i===1?'active':''}" data-cat="${c}" onclick="selectCat(this)">${c}</button>`).join('')}</div><div class="actions top-space"><input id="taskInput" class="field" maxlength="60" placeholder="例如：精读一篇核心文献"><button class="primary" onclick="addTask()">加入</button></div>${feedback()}<div>${tasks.length?tasks.map(taskCard).join(''):'<div class="card muted center">这一天还没有计划。</div>'}</div></main>${navBar()}`}
function selectCat(el){document.querySelectorAll('#planCats .chip').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function addTask(){const input=$('#taskInput'),title=input.value.trim();if(!title)return showFeedback('先写下一个具体的小目标。');const w=workspace(),k=keyOf(state.date);if(w.tasks.some(t=>t.date===k&&t.title===title))return showFeedback('这个日期已经有同名计划。');const cat=$('#planCats .active')?.dataset.cat||'写作';w.tasks.push({id:'t'+Date.now(),date:k,title,category:cat,done:false});saveWorkspace(w);state.feedback='已加入计划。';render()}
function taskCard(t){return `<div class="card task ${t.done?'done':''}"><button class="check" onclick="toggleTask('${t.id}')">${t.done?'✓':'○'}</button><div class="grow"><div class="task-name">${esc(t.title)}</div><div class="task-meta">${t.category}</div></div><button class="danger" onclick="removeTask('${t.id}')">移除</button></div>`}
function toggleTask(id){const w=workspace(),t=w.tasks.find(x=>x.id===id);if(t)t.done=!t.done;saveWorkspace(w);render()} function removeTask(id){if(!confirm('确认移除这条计划？'))return;const w=workspace();w.tasks=w.tasks.filter(x=>x.id!==id);saveWorkspace(w);render()}
function shiftDate(n){state.date=new Date(state.date.getFullYear(),state.date.getMonth(),state.date.getDate()+n,12);render()}
function formatTimer(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function renderFocus(){return `<main class="page">${header('专注','选择一个时长，只推进一件事')}<div class="chips">${[15,25,45,60].map(n=>`<button class="chip ${state.focusMinutes===n?'active':''}" onclick="setDuration(${n})">${n}分钟</button>`).join('')}</div><div class="timer">${formatTimer(state.focusLeft)}</div><input id="focusTarget" class="field" maxlength="60" placeholder="本次专注目标（可选）"><div class="actions top-space"><button class="primary" onclick="toggleFocus()">${state.focusRunning?'暂停':state.focusLeft<state.focusMinutes*60?'继续':'开始专注'}</button><button class="soft" onclick="resetFocus()">重置</button></div>${feedback()}<section class="card small muted">计时按真实截止时间计算。完整完成后才会计入今日专注时长；未完成计时在结束应用后重置，不发送后台通知。</section></main>${navBar()}`}
function setDuration(n){if(state.focusRunning)return;state.focusMinutes=n;state.focusLeft=n*60;render()} function toggleFocus(){if(state.focusRunning){state.focusLeft=Math.max(0,Math.ceil((state.focusDeadline-Date.now())/1000));state.focusRunning=false;clearInterval(state.focusTimer);render();return}state.focusRunning=true;state.focusDeadline=Date.now()+state.focusLeft*1000;state.focusTimer=setInterval(tickFocus,500);render()}
function tickFocus(){state.focusLeft=Math.max(0,Math.ceil((state.focusDeadline-Date.now())/1000));if(state.focusLeft<=0){clearInterval(state.focusTimer);state.focusRunning=false;const w=workspace();w.sessions.push({id:'f'+Date.now(),date:keyOf(new Date()),minutes:state.focusMinutes});saveWorkspace(w);state.feedback=`已记录${state.focusMinutes}分钟专注。`;state.focusLeft=state.focusMinutes*60;render()}else{const timer=document.querySelector('.timer');if(timer)timer.textContent=formatTimer(state.focusLeft)}}
function resetFocus(){clearInterval(state.focusTimer);state.focusRunning=false;state.focusLeft=state.focusMinutes*60;render()}
function daySummary(w,k){const tasks=w.tasks.filter(t=>t.date===k);return {planned:tasks.length,done:tasks.filter(t=>t.done).length,minutes:w.sessions.filter(s=>s.date===k).reduce((a,b)=>a+b.minutes,0)}}
function renderReview(){const w=workspace(),k=keyOf(state.date),s=daySummary(w,k),rows=[];for(let i=-6;i<=0;i++){const d=new Date(state.date.getFullYear(),state.date.getMonth(),state.date.getDate()+i,12),dk=keyOf(d),x=daySummary(w,dk);rows.push(`<div class="week-row"><span>${d.getMonth()+1}.${d.getDate()} 星期${'日一二三四五六'[d.getDay()]}</span><span>${x.done}/${x.planned}项</span><span>${x.minutes}分钟</span></div>`)}return `<main class="page">${header('科研回顾','保存当日一记，查看最近七天的推进')}<div class="summary"><div class="stat"><strong>${s.done}</strong>已完成</div><div class="stat"><strong>${s.planned}</strong>计划</div><div class="stat"><strong>${s.minutes}</strong>分钟</div></div><section class="card"><b>最近七天</b>${rows.join('')}</section><textarea id="reviewText" class="field" maxlength="400" placeholder="今天推进了什么？下一步是什么？">${esc(w.reviews[k]||'')}</textarea><button class="primary top-space" style="width:100%" onclick="saveReview()">保存当日回顾</button>${feedback()}</main>${navBar()}`}
function saveReview(){const w=workspace(),k=keyOf(state.date);w.reviews[k]=$('#reviewText').value.slice(0,400);saveWorkspace(w);showFeedback('回顾已保存在本机。')}
function showAbout(){$('#root').insertAdjacentHTML('beforeend',modal(`<h2>关于学术黄历</h2><p class="policy">科研人的每日宜忌与离线工作台。通用语料与14个学科门类的专属语料共同生成每日内容。</p><div class="about-card"><div class="muted small">当前学科门类</div><div class="row"><strong class="grow" style="font-size:19px">${settings().discipline}</strong><button class="soft" onclick="openDiscipline()">修改</button></div></div><button class="outline" style="width:100%" onclick="showPolicy()">查看完整隐私政策</button><button class="outline top-space" style="width:100%" onclick="clearLocal()">清除本机记录</button><p class="small muted">版本1.2.0 · Android/HarmonyOS 4兼容版<br>全部功能离线运行，不申请网络或敏感权限。</p><button class="primary" style="width:100%" onclick="render()">返回应用</button>`))}
function clearLocal(){if(!confirm('学科选择、计划、收藏、专注与回顾将永久删除，是否继续？'))return;localStorage.removeItem('workspaceV12');const s=settings();delete s.discipline;saveSettings(s);state.disciplineDraft='';state.changeDiscipline=false;render()}
function render(){const s=settings();if(!s.privacy)return renderPrivacy();if(!DISCIPLINES.includes(s.discipline)||state.changeDiscipline)return renderDiscipline();if(state.page==='plan')$('#root').innerHTML=renderPlan();else if(state.page==='focus')$('#root').innerHTML=renderFocus();else if(state.page==='review')$('#root').innerHTML=renderReview();else $('#root').innerHTML=renderAlmanac()}
window.handleAndroidBack=()=>{if(document.querySelector('.overlay')){render();return 'handled'}if(state.page!=='almanac'){state.page='almanac';render();return 'handled'}return 'exit'};
if(window.ALMANAC_BASE&&window.DISCIPLINE_CORPUS){state.base=window.ALMANAC_BASE;state.corpus=window.DISCIPLINE_CORPUS;render()}else{$('#root').innerHTML='<div class="page center">本地语料库加载失败，请重新启动应用。</div>'}
</script></body></html>
